name: CI

# Runs on every push and pull request targeting main/master. This is the
# "Next" roadmap item from the enterprise readiness review — previously
# Dockerfiles existed but nothing ran tests/typecheck/build automatically,
# which is exactly how a permission regression (like the ones found and
# fixed earlier in this project) could ship unnoticed.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (typecheck, test, build)
    runs-on: ubuntu-latest

    # Real Postgres + Redis service containers, not mocks — so this pipeline
    # is ready for integration tests later, not just the current unit tests
    # (which mock Prisma/Redis directly and don't need these, but future
    # controller-level tests likely will).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connecthub
          POSTGRES_PASSWORD: connecthub
          POSTGRES_DB: connecthub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U connecthub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://connecthub:connecthub@localhost:5432/connecthub_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply schema to test database
        run: npx prisma db push --skip-generate

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --ci --coverage

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      # Placeholder values so the build doesn't fail on missing env vars —
      # nothing here needs to be real for a build-only CI check.
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t connecthub-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t connecthub-frontend:ci ./frontend
